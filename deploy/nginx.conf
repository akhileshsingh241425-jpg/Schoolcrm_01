server {
    listen 80;
    server_name 93.127.194.235;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name 93.127.194.235;

    # SSL — configure after running certbot
    ssl_certificate     /etc/letsencrypt/live/93.127.194.235/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/93.127.194.235/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root /var/www/school-crm/frontend/build;
    index index.html;

    client_max_body_size 16M;

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy strict-origin-when-cross-origin;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()";
    add_header X-Download-Options noopen;

    # Hide nginx version
    server_tokens off;

    # React SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;

        # Rate limiting: 30 req/s per IP
        limit_req zone=api burst=50 nodelay;
        limit_req_status 429;
    }

    # Static uploads
    location /uploads/ {
        alias /var/www/school-crm/backend/uploads/;
        add_header Cache-Control "public, immutable, max-age=31536000";
    }

    # Deny access to .env, .git, etc.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ (\.env|composer\.json|package\.json|requirements\.txt)$ {
        deny all;
    }
}

# Rate limit zone definition (shared memory)
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
